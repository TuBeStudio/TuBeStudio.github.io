<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Tuur Bellers — Game Developer</title>
  <meta name="description" content="Gameplay & AI programming student at Howest DAE — building responsive gameplay systems and intelligent behaviors."/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
  <div class="container navrow">
    <a class="brand" href="#home">&lt;TB/&gt;</a>
    <ul class="nav-links" id="nav-links"></ul>
    <button class="hamburger" id="hamburger" aria-expanded="false" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </div>
  <nav class="mobile-nav" id="mobile-nav"></nav>
</header>

<main id="page-root"></main>

<!-- HERO -->
<section id="home" class="hero grid-bg">
  <div class="hero-gradient"></div>
  <div class="hero-orb"></div>
  <div class="hero-orb2"></div>
  <div class="hero-content" id="hero-content"></div>
  <div class="scroll-hint">↓ scroll down</div>
</section>

<!-- PROJECTS -->
<section id="projects" class="section">
  <div class="container">
    <p class="sec-num anim">// 01</p>
    <h2 class="sec-title anim d1">PROJECTS</h2>
    <div class="filter-row anim d2" id="filter-row">
      <button class="f-btn active" data-filter="all">All</button>
    </div>
    <div class="proj-grid" id="proj-grid"></div>
  </div>
</section>

<!-- SKILLS -->
<section id="skills" class="section">
  <div class="container">
    <p class="sec-num anim">// 02</p>
    <h2 class="sec-title anim d1">SKILLS</h2>
    <div class="skills-grid" id="skills-grid"></div>
  </div>
</section>

<!-- ABOUT -->
<section id="about" class="section">
  <div class="container">
    <p class="sec-num anim">// 03</p>
    <h2 class="sec-title anim d1">ABOUT ME</h2>
    <div class="about-grid" id="about-grid"></div>
  </div>
</section>

<!-- CONTACT -->
<div id="extras-root"></div>

<!-- CONTACT -->
<section id="contact" class="section">
  <div class="container">
    <div class="contact-header">
      <p class="sec-num">// 04</p>
      <h2 class="sec-title anim">GET IN TOUCH</h2>
      <p class="contact-sub" id="contact-sub"></p>
    </div>
    <div class="contact-list" id="contact-list"></div>
  </div>
</section>

<div id="custom-pages-root"></div>

<!-- FOOTER -->
<footer class="foot">
  <div class="container">
    <p>&copy; <span id="year"></span> Tuur Bellers &mdash; Howest DAE</p>
  </div>
</footer>

<script src="content.js"></script>
<script src="script.js"></script>
</body>
</html>
