<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Portfolio CMS</title>
<style>
/* ================================================================
   TOKENS
   ================================================================ */
:root {
  --bg: #0e0f15;
  --surface: #151620;
  --card: #1c1d2a;
  --card-hover: #222336;
  --border: #2a2c3e;
  --border-light: #363850;
  --fg: #e0e2ea;
  --muted: #6b7094;
  --primary: #2dd4bf;
  --primary-dim: rgba(45,212,191,.1);
  --primary-mid: rgba(45,212,191,.25);
  --accent: #a78bfa;
  --accent-dim: rgba(167,139,250,.1);
  --danger: #f87171;
  --danger-dim: rgba(248,113,113,.08);
  --success: #34d399;
  --warn: #fbbf24;
  --radius: 6px;
  --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
  --mono: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', Consolas, monospace;
  --shadow: 0 4px 24px rgba(0,0,0,.4);
  --shadow-lg: 0 12px 48px rgba(0,0,0,.6);
}

/* ================================================================
   RESET
   ================================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:13px;line-height:1.5;overflow:hidden}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--border-light)}
input,textarea,select,button{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--primary);text-decoration:none}
::selection{background:var(--primary-mid);color:var(--fg)}

/* ================================================================
   APP LAYOUT
   ================================================================ */
#app{display:flex;flex-direction:column;height:100vh}

/* ---- Toolbar ---- */
.toolbar{
  display:flex;align-items:center;gap:8px;
  padding:0 14px;height:48px;min-height:48px;
  background:var(--surface);border-bottom:1px solid var(--border);
  z-index:100;
}
.toolbar-logo{
  font-family:var(--mono);font-size:14px;font-weight:700;
  color:var(--primary);margin-right:6px;letter-spacing:.06em;
}
.toolbar-sep{width:1px;height:24px;background:var(--border);margin:0 4px}
.toolbar-group{display:flex;align-items:center;gap:2px}
.toolbar-spacer{flex:1}
.save-status{
  font-family:var(--mono);font-size:11px;color:var(--muted);
  display:flex;align-items:center;gap:5px;margin-right:8px;
}
.save-dot{width:7px;height:7px;border-radius:50%;background:var(--success);flex-shrink:0}
.save-dot.dirty{background:var(--warn);animation:pulse 1.5s infinite}
@keyframes pulse{50%{opacity:.4}}

/* Toolbar buttons */
.tb{
  display:flex;align-items:center;justify-content:center;gap:5px;
  height:32px;min-width:32px;padding:0 8px;
  background:transparent;border:1px solid transparent;border-radius:var(--radius);
  color:var(--muted);cursor:pointer;transition:all .1s;font-size:12px;font-weight:500;
  white-space:nowrap;
}
.tb:hover{color:var(--fg);background:var(--card);border-color:var(--border)}
.tb:active{transform:scale(.96)}
.tb.active{color:var(--primary);background:var(--primary-dim);border-color:rgba(45,212,191,.2)}
.tb svg{width:15px;height:15px;flex-shrink:0}
.tb-label{display:inline}
.tb-primary{background:var(--primary);border-color:var(--primary);color:var(--bg);font-weight:700}
.tb-primary:hover{background:#3ee8d1;border-color:#3ee8d1}
.tb-accent{color:var(--accent)}
.tb-accent:hover{background:var(--accent-dim);border-color:rgba(167,139,250,.3)}
.tb[disabled]{opacity:.3;pointer-events:none}

@media(max-width:800px){.tb-label{display:none}.toolbar-sep:nth-child(n+4){display:none}}

/* ---- Body: sidebar + split ---- */
.app-body{display:flex;flex:1;overflow:hidden}

/* ---- Sidebar ---- */
.sidebar{
  width:52px;min-width:52px;
  background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;
  padding:10px 0;gap:2px;
  transition:width .2s;
}
.sidebar.expanded{width:180px;min-width:180px;align-items:stretch}
.sidebar-toggle{
  width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  background:none;border:none;color:var(--muted);cursor:pointer;border-radius:var(--radius);
  margin-bottom:8px;transition:all .12s;
}
.sidebar-toggle:hover{color:var(--fg);background:var(--card)}
.sidebar.expanded .sidebar-toggle{align-self:flex-end;margin-right:8px}
.sb-link{
  display:flex;align-items:center;justify-content:center;
  width:36px;height:36px;border-radius:var(--radius);
  color:var(--muted);cursor:pointer;border:none;background:none;
  transition:all .12s;position:relative;
}
.sb-link:hover{color:var(--fg);background:var(--card)}
.sb-link.active{color:var(--primary);background:var(--primary-dim)}
.sb-link svg{width:18px;height:18px;flex-shrink:0}
.sb-link span{display:none;font-size:13px;font-weight:500;margin-left:10px}
.sidebar.expanded .sb-link{width:auto;justify-content:flex-start;padding:0 14px;height:36px}
.sidebar.expanded .sb-link span{display:inline}
.sb-section{
  height:30px;
  font-size:11px;
  opacity:.88;
}
.sb-hidden{
  opacity:.45;
}
.sb-hidden span::after{
  content:" hidden";
  color:var(--danger);
  font-family:var(--mono);
  font-size:9px;
  margin-left:4px;
}
.sb-section svg{width:14px;height:14px}
.sidebar.expanded .sb-section{padding-left:24px}
.sb-section span{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.sb-label{
  display:none;
  padding:8px 14px 4px;
  font-size:10px;
  font-family:var(--mono);
  color:var(--muted);
  letter-spacing:.12em;
  text-transform:uppercase;
}
.sidebar.expanded .sb-label{display:block}
.sb-label-row{
  display:none;
  align-items:center;
  gap:6px;
  padding:8px 10px 4px 14px;
}
.sidebar.expanded .sb-label-row{display:flex}
.sb-label-row .sb-label{
  display:block;
  padding:0;
  flex:1;
}
.sb-mini{
  width:22px;
  height:22px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--muted);
  border-radius:var(--radius);
  cursor:pointer;
  font-family:var(--mono);
  line-height:1;
}
.sb-mini:hover{
  color:var(--primary);
  border-color:var(--primary);
}
.sb-link[data-tooltip]::after{
  content:attr(data-tooltip);position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%);
  background:var(--card);border:1px solid var(--border);border-radius:4px;
  padding:4px 10px;font-size:11px;color:var(--fg);white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .15s;z-index:200;
}
.sb-link:hover[data-tooltip]::after{opacity:1}
.sidebar.expanded .sb-link::after{display:none}
.sb-sep{width:24px;height:1px;background:var(--border);margin:6px 0}
.sidebar.expanded .sb-sep{width:calc(100% - 28px);margin:6px 14px}

/* ---- Split pane ---- */
.split{display:flex;flex:1;overflow:hidden}
.split-editor{flex:1;min-width:280px;overflow-y:auto;padding:24px 28px 80px}
.split-handle{
  width:5px;background:var(--border);cursor:col-resize;flex-shrink:0;
  transition:background .12s;position:relative;
}
.split-handle:hover,.split-handle.dragging{background:var(--primary)}
.split-handle::after{
  content:'';position:absolute;inset:-0 -4px;
}
.split-preview{
  width:50%;min-width:320px;background:var(--bg);
  display:flex;flex-direction:column;overflow:hidden;
}
.split-preview.hidden{display:none}
#app.preview-focus .split-editor,
#app.preview-focus .split-handle{display:none!important}
#app.preview-focus .split-preview{width:100%!important;min-width:0}
.preview-bar{
  display:flex;align-items:center;gap:6px;
  padding:5px 10px;min-height:34px;flex-wrap:wrap;
  background:var(--surface);border-bottom:1px solid var(--border);
  border-left:1px solid var(--border);font-size:11px;
}
.preview-bar select{
  background:var(--card);border:1px solid var(--border);border-radius:4px;
  color:var(--fg);padding:3px 8px;font-size:11px;font-family:var(--mono);
  cursor:pointer;outline:none;
}
.preview-bar select:focus{border-color:var(--primary)}
.preview-bar .muted{color:var(--muted);font-family:var(--mono)}
.preview-url{
  flex:1;font-family:var(--mono);color:var(--muted);font-size:10px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right;
}
.compare-diff{
  max-width:340px;font-family:var(--mono);font-size:10px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px;
}
.compare-diff strong{color:var(--primary);font-weight:700}
.diff-chip{
  border:1px solid var(--border);background:var(--card);color:var(--muted);
  border-radius:999px;padding:1px 7px;font-size:10px;cursor:pointer;
}
.diff-chip:hover{border-color:var(--primary);color:var(--primary)}
.diff-chip.active{background:var(--primary-dim);border-color:var(--primary);color:var(--primary)}
.preview-shell{flex:1;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:8px}
.preview-col{height:100%;display:flex;flex-direction:column;align-items:center;width:100%;min-width:0}
#preview-shell.compare{gap:8px;align-items:stretch;justify-content:stretch}
#preview-shell.compare .preview-col{flex:1;gap:4px}
#preview-shell.compare .preview-label{font-size:10px;color:var(--muted);font-family:var(--mono);padding-left:4px}
#preview-frame{flex:1;border:none;background:#0b0c10;width:100%}
#preview-frame.viewport-desktop{width:100%;max-width:none;height:100%}
#preview-frame.viewport-tablet{width:820px;max-width:100%;height:100%;border:1px solid var(--border);border-radius:8px}
#preview-frame.viewport-mobile{width:390px;max-width:100%;height:100%;border:1px solid var(--border);border-radius:14px}
#preview-frame-b{flex:1;border:none;background:#0b0c10;width:100%}
#preview-frame-b.viewport-desktop{width:100%;max-width:none;height:100%}
#preview-frame-b.viewport-tablet{width:820px;max-width:100%;height:100%;border:1px solid var(--border);border-radius:8px}
#preview-frame-b.viewport-mobile{width:390px;max-width:100%;height:100%;border:1px solid var(--border);border-radius:14px}

/* ================================================================
   COMPONENTS
   ================================================================ */

/* Section header */
.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.sec-head h2{font-size:16px;font-weight:700}
.sec-head .badge{
  font-family:var(--mono);font-size:11px;color:var(--muted);
  background:var(--card);border:1px solid var(--border);
  padding:2px 10px;border-radius:99px;
}
.sec-head .spacer{flex:1}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;gap:5px;
  padding:7px 14px;border-radius:var(--radius);border:1px solid var(--border);
  background:var(--card);color:var(--fg);font-weight:600;font-size:12px;
  cursor:pointer;transition:all .1s;white-space:nowrap;
}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn:active{transform:scale(.97)}
.btn svg{width:13px;height:13px}
.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--bg);font-weight:700}
.btn-primary:hover{background:#3ee8d1}
.btn-danger{color:var(--danger)}
.btn-danger:hover{background:var(--danger-dim);border-color:var(--danger)}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--card)}

/* Fields */
.field{margin-bottom:14px}
.field label{
  display:flex;align-items:center;gap:6px;
  font-size:10px;font-weight:700;letter-spacing:.08em;
  color:var(--muted);margin-bottom:4px;text-transform:uppercase;
}
.field label .sym-trigger{
  margin-left:auto;font-size:14px;cursor:pointer;opacity:.4;
  transition:opacity .12s;user-select:none;
}
.field label .sym-trigger:hover{opacity:1;color:var(--accent)}
.field input,.field textarea,.field select{
  width:100%;padding:8px 10px;
  background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);
  color:var(--fg);outline:none;transition:border-color .12s;
}
.field input:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-dim)}
.field textarea{resize:vertical;min-height:68px;line-height:1.6}
.field select{cursor:pointer}
.field-row{display:flex;gap:10px}
.field-row>.field{flex:1}
.field-hint{font-size:10px;color:var(--muted);margin-top:3px}

/* Image preview */
.thumb-preview{
  width:80px;height:45px;border-radius:4px;overflow:hidden;
  border:1px solid var(--border);background:var(--bg);flex-shrink:0;
}
.thumb-preview img{width:100%;height:100%;object-fit:cover}
.thumb-preview.empty{display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--border)}

/* Toggle */
.toggle-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.toggle{
  width:34px;height:18px;border-radius:9px;
  background:var(--border);position:relative;cursor:pointer;
  transition:background .15s;border:none;flex-shrink:0;
}
.toggle.on{background:var(--primary)}
.toggle::after{
  content:'';position:absolute;top:2px;left:2px;
  width:14px;height:14px;border-radius:50%;
  background:var(--fg);transition:transform .15s;
}
.toggle.on::after{transform:translateX(16px)}
.toggle-label{font-size:12px;color:var(--muted)}

/* Editor cards */
.e-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);margin-bottom:8px;
  transition:border-color .12s,box-shadow .12s;
}
.e-card:hover{border-color:var(--border-light)}
.e-card.dragging{opacity:.35;transform:scale(.98)}
.e-card.drag-over{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}

.e-card-head{
  display:flex;align-items:center;gap:8px;
  padding:10px 14px;cursor:pointer;user-select:none;
  transition:background .08s;border-radius:var(--radius);
}
.e-card-head:hover{background:var(--card-hover)}
.drag-handle{
  cursor:grab;color:var(--border-light);font-size:13px;
  display:flex;align-items:center;transition:color .1s;flex-shrink:0;
}
.drag-handle:hover{color:var(--muted)}
.drag-handle:active{cursor:grabbing}
.e-card-title{font-weight:600;flex:1;font-size:13px}
.e-card-sub{font-family:var(--mono);font-size:11px;color:var(--muted)}
.e-card-badge{
  font-family:var(--mono);font-size:9px;font-weight:700;
  padding:2px 7px;border-radius:3px;letter-spacing:.04em;text-transform:uppercase;
}
.e-card-badge.completed{background:rgba(45,212,191,.12);color:var(--primary)}
.e-card-badge.ongoing{background:rgba(167,139,250,.12);color:var(--accent)}
.chevron{
  color:var(--muted);transition:transform .15s;flex-shrink:0;font-size:11px;
}
.chevron.open{transform:rotate(90deg)}
.e-card-body{padding:0 14px 14px;display:none}
.e-card-body.open{display:block}
.e-card-foot{
  display:flex;gap:6px;padding:6px 14px;
  border-top:1px solid var(--border);
}

/* Tags */
.tag-editor{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:6px 0}
.tag-pill{
  display:inline-flex;align-items:center;gap:3px;
  background:var(--bg);border:1px solid var(--border);border-radius:3px;
  padding:2px 7px;font-family:var(--mono);font-size:10px;color:var(--primary);
}
.tag-pill button{
  background:none;border:none;color:var(--muted);cursor:pointer;
  font-size:13px;line-height:1;padding:0;
}
.tag-pill button:hover{color:var(--danger)}
.tag-input{
  background:none;border:1px solid transparent;border-radius:3px;
  color:var(--fg);outline:none;font-family:var(--mono);font-size:10px;
  width:70px;padding:2px 6px;
}
.tag-input:focus{border-color:var(--border);background:var(--bg)}

/* Skill slider */
.sk-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:4px 0}
.sk-name-input{
  flex:1;background:transparent;border:1px solid transparent;
  color:var(--fg);padding:3px 6px;border-radius:4px;font-size:12px;min-width:0;
}
.sk-name-input:focus{border-color:var(--border);background:var(--bg)}
.sk-score-wrap{display:flex;align-items:center;gap:8px}
.sk-score{
  width:62px;padding:5px 7px!important;
  font-family:var(--mono);font-size:11px;text-align:center;
}
.sk-score-pills{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;width:90px}
.sk-pill{height:6px;border-radius:99px;background:var(--border);cursor:pointer;transition:all .12s;border:1px solid transparent}
.sk-pill.active{background:var(--primary);box-shadow:0 0 10px rgba(45,212,191,.2);border-color:rgba(45,212,191,.35)}
.sk-pill.half{background:linear-gradient(90deg,var(--primary) 50%,var(--border) 50%);border-color:rgba(45,212,191,.3)}
.sk-del{background:none;border:none;color:var(--border-light);cursor:pointer;font-size:14px;padding:0 2px}
.sk-del:hover{color:var(--danger)}

/* Theme controls */
.palette-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:10px}
.color-chip{display:flex;align-items:center;gap:8px}
.color-chip input[type="color"]{width:28px;height:28px;padding:0;border:none;background:none;cursor:pointer}
.preset-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tiny{font-size:10px;color:var(--muted);font-family:var(--mono)}
.style-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin:10px 0 12px}
.style-card{
  border:1px solid var(--border);border-radius:8px;background:var(--card);overflow:hidden;
  transition:border-color .12s,transform .12s;
}
.style-card.active{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary-mid)}
.style-card:hover{transform:translateY(-1px)}
.style-preview{padding:10px;border-bottom:1px solid var(--border)}
.style-swatch-row{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:8px}
.style-swatch{height:14px;border-radius:3px;border:1px solid rgba(255,255,255,.08)}
.style-mini{
  background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:7px;
}
.style-mini-title{font-size:9px;font-weight:700;letter-spacing:.08em;margin-bottom:5px}
.style-mini-line{height:5px;border-radius:3px;background:var(--muted);opacity:.45;margin-bottom:4px}
.style-mini-line:last-child{width:70%;margin-bottom:0}
.style-meta{padding:8px 10px}
.style-meta-head{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.style-name{font-size:11px;font-weight:700;flex:1}

/* List items */
.list-item{
  display:flex;gap:6px;align-items:flex-start;
  margin-bottom:6px;padding:6px 8px;
  background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);
  transition:border-color .1s;
}
.list-item:focus-within{border-color:var(--border-light)}
.list-item .drag-handle{margin-top:6px}
.list-item textarea{
  flex:1;background:transparent;border:none;color:var(--fg);
  resize:vertical;min-height:32px;outline:none;padding:3px 4px;
  font-size:12px;line-height:1.5;
}

/* Detail section builder */
.sec-block{
  background:var(--bg);border:1px solid var(--border);
  border-radius:var(--radius);padding:12px;margin-bottom:8px;
}
.sec-block-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sec-cols{display:flex;gap:10px}
.sec-cols.two-col>*{flex:1}
.sec-col{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:10px;min-width:0;
}
.col-type-btns{display:flex;gap:4px;margin-bottom:6px}
.col-type-btn{
  padding:3px 8px;font-size:10px;font-weight:600;
  border:1px solid var(--border);border-radius:3px;
  background:transparent;color:var(--muted);cursor:pointer;transition:all .1s;
}
.col-type-btn.active{background:var(--primary-dim);border-color:rgba(45,212,191,.3);color:var(--primary)}
.col-type-btn:hover:not(.active){color:var(--fg)}
.bullet-row{display:flex;gap:4px;margin-bottom:3px;align-items:center}
.bullet-row::before{content:'▹';color:var(--primary);font-size:11px;flex-shrink:0}
.bullet-row input{
  flex:1;background:var(--bg);border:1px solid var(--border);
  border-radius:3px;color:var(--fg);padding:3px 6px;font-size:11px;outline:none;
}
.bullet-row input:focus{border-color:var(--primary)}
.bullet-del{background:none;border:none;color:var(--border-light);cursor:pointer;font-size:12px}
.bullet-del:hover{color:var(--danger)}

/* Search */
.search-box{
  display:flex;align-items:center;gap:6px;
  background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);
  padding:0 10px;margin-bottom:14px;
}

<script>
// ================================================================
//  STATE
// ================================================================
let data = JSON.parse(JSON.stringify(SITE));
let currentTab = "builder";
let previewVisible = true;
let previewCompare = false;
let selectedDeltaToken = "";
let fileHandle = null;
let dirty = false;
let searchQuery = "";
var openCards = new Set();   // tracks which cards are expanded
var focusAfterRender = null; // selector to refocus after render
var activeBuilderSectionIndex = null;
var activeCustomPageIndex = null;

var FONT_STACKS = {
  system: "'Segoe UI', 'Verdana', 'Tahoma', sans-serif",
  modern: "'Inter', 'Arial', 'Helvetica Neue', sans-serif",
  display: "'Orbitron', 'Segoe UI', sans-serif",
  humanist: "'Trebuchet MS', 'Segoe UI', sans-serif",
  mono: "'Cascadia Code', 'Consolas', monospace",
  jet: "'JetBrains Mono', 'Consolas', monospace"
};
var PALETTE_PRESETS = {
  cyber: { bg:"#10131e", card:"#1a1f2e", sec:"#202739", border:"#2a3550", fg:"#e8ecff", muted:"#8f9ab8", primary:"#2dd4bf", accent:"#a78bfa" },
  obsidian: { bg:"#0d0e11", card:"#1a1b1f", sec:"#23262d", border:"#313641", fg:"#f2f3f8", muted:"#9aa1b3", primary:"#60a5fa", accent:"#f472b6" },
  ember: { bg:"#17110f", card:"#261b18", sec:"#322422", border:"#4b3531", fg:"#f9ede6", muted:"#b79d92", primary:"#fb923c", accent:"#f43f5e" },
  mint: { bg:"#0f1714", card:"#172520", sec:"#1e3129", border:"#2d463a", fg:"#e9fff6", muted:"#8fb9a8", primary:"#34d399", accent:"#22d3ee" }
};
var BUILDER_SECTION_TYPES = ["hero","project-grid","skills","about","contact","text","cta","timeline","testimonials","availability","recruiter"];

function normalizeDataModel() {
  if (!data.customization) data.customization = {};
  if (!data.customization.palette) data.customization.palette = JSON.parse(JSON.stringify(PALETTE_PRESETS.cyber));
  if (!data.customization.fonts) {
    data.customization.fonts = { display: FONT_STACKS.display, body: FONT_STACKS.system, mono: FONT_STACKS.mono };
  }
  if (!data.customization.sectionVisibility) {
    data.customization.sectionVisibility = { projects:true, skills:true, about:true, contact:true };
  }
  if (!data.availability) data.availability = { enabled:false, text:"Open to internships and junior gameplay/AI roles.", ctaLabel:"Contact", ctaHref:"#contact" };
  if (!data.recruiterMode) data.recruiterMode = { enabled:false, headline:"Recruiter Snapshot", summary:"Short hiring-focused summary.", bullets:["Top skill","Best project","Availability"], ctaLabel:"Download CV", ctaHref:"assets/resume.pdf" };
  if (!Array.isArray(data.timeline)) data.timeline = [];
  if (!Array.isArray(data.testimonials)) data.testimonials = [];
  if (!Array.isArray(data.pages)) {
    data.pages = [{ id:"home", title:"Home", sections:[
      newBuilderSection("hero", true),
      newBuilderSection("project-grid", true),
      newBuilderSection("skills", true),
      newBuilderSection("about", true),
      newBuilderSection("contact", true)
    ] }];
  }
  data.pages.forEach(function(page) {
    if (!Array.isArray(page.sections)) page.sections = [];
    page.sections = page.sections.map(normalizeBuilderSection);
  });
  if (!data.customization.aiAssistant) {
    data.customization.aiAssistant = {
      enabled: true,
      name: "Nova",
      greeting: "Hi! I am Nova, Tuur's portfolio assistant. Ask me about projects, skills, or contact info.",
      startOpen: false,
      mode: "web-llm",
      localModel: "Qwen2.5-0.5B-Instruct-q4f16_1-MLC",
      knowledgeNotes: ""
    };
  }
  if (data.customization.aiAssistant.mode === "local-llm") data.customization.aiAssistant.mode = "web-llm";
  if (!Array.isArray(data.customization.pageTemplates)) data.customization.pageTemplates = [];
  if (!Array.isArray(data.customization.builderSectionPrefabs)) data.customization.builderSectionPrefabs = [];
  data.customization.builderSectionPrefabs = data.customization.builderSectionPrefabs
    .filter(function(p) { return p && p.section; })
    .map(function(p) {
      return { name:p.name || "Section Prefab", section:normalizeBuilderSection(p.section) };
    });
  if (!Array.isArray(data.customization.styleProfiles)) data.customization.styleProfiles = [];
  if (!data.customization.styleProfiles.length) {
    data.customization.styleProfiles = [
      { id: "cyber-core", name: "Cyber Core", palette: JSON.parse(JSON.stringify(data.customization.palette)), fonts: JSON.parse(JSON.stringify(data.customization.fonts)) }
    ];
  }
  if (!data.customization.currentStyleProfile) data.customization.currentStyleProfile = data.customization.styleProfiles[0].id;
  if (!Array.isArray(data.customPages)) data.customPages = [];
  data.customPages = data.customPages.map(function(p, i) {
    var id = sanitizeSlug(p.id || ("custom-page-" + (i + 1)));
    var blocks = Array.isArray(p.blocks) ? p.blocks : [];
    if (!blocks.length && p.content) {
      blocks = [{ type: "text", title: "Overview", body: p.content }];
    }
    return {
      id: id || ("custom-page-" + (i + 1)),
      title: p.title || "Custom Page",
      navLabel: p.navLabel || p.title || "Page",
      layout: p.layout || "stack",
      visible: p.visible !== false,
      styleProfile: p.styleProfile || "",
      theme: p.theme || { inherit: true, primary: "", accent: "", card: "" },
      content: p.content || "",
      blocks: blocks.map(normalizePageBlock)
    };
  });
  syncCustomizationFromProfile(false);
  data.skills.forEach(function(cat) {
    cat.items.forEach(function(item) {
      if (typeof item.score !== "number") item.score = typeof item.pct === "number" ? +(item.pct / 20).toFixed(1) : 3;
      item.score = Math.max(0, Math.min(5, +item.score || 0));
    });
  });
}
function getCurrentStyleProfile() {
  var id = data.customization.currentStyleProfile;
  var p = (data.customization.styleProfiles || []).find(function(sp) { return sp.id === id; });
  return p || data.customization.styleProfiles[0];
}
function syncCustomizationFromProfile(mark) {
  var p = getCurrentStyleProfile();
  if (!p) return;
  data.customization.palette = JSON.parse(JSON.stringify(p.palette));
  data.customization.fonts = JSON.parse(JSON.stringify(p.fonts));
  if (mark) onChange();
}
function persistCustomizationIntoProfile() {
  var p = getCurrentStyleProfile();
  if (!p) return;
  p.palette = JSON.parse(JSON.stringify(data.customization.palette));
  p.fonts = JSON.parse(JSON.stringify(data.customization.fonts));
}
function normalizePageBlock(block) {
  block = block || {};
  var t = block.type || "text";
  if (t === "bullet") return { type: "bullet", title: block.title || "Highlights", items: Array.isArray(block.items) ? block.items : [""] };
  if (t === "cta") return { type: "cta", title: block.title || "Call To Action", body: block.body || "", label: block.label || "Contact Me", href: block.href || "#contact" };
  if (t === "stats") return { type: "stats", title: block.title || "Stats", items: Array.isArray(block.items) ? block.items : [{ label: "Years", value: "3+" }, { label: "Projects", value: "10+" }] };
  if (t === "quote") return { type: "quote", title: block.title || "Quote", body: block.body || "A short proof point or testimonial.", label: block.label || "" };
  if (t === "media") return { type: "media", title: block.title || "Media", src: block.src || "", alt: block.alt || "", caption: block.caption || "" };
  if (t === "divider") return { type: "divider", title: block.title || "Divider" };
  return { type: "text", title: block.title || "Section", body: block.body || "" };
}
function newPageBlock(type) {
  return normalizePageBlock({ type:type });
}
function newBuilderSection(type, stableAnchor) {
  var anchors = { hero:"home", "project-grid":"projects", skills:"skills", about:"about", contact:"contact", timeline:"timeline", testimonials:"testimonials", availability:"availability", recruiter:"recruiter" };
  var id = stableAnchor ? (anchors[type] || type) : type + "-" + Date.now().toString(36) + "-" + Math.floor(Math.random() * 999);
  var titles = {
    hero:"Hero", "project-grid":"Projects", skills:"Skills", about:"About", contact:"Contact",
    text:"Text Section", cta:"Call To Action", timeline:"Timeline", testimonials:"Testimonials",
    availability:"Availability", recruiter:"Recruiter Snapshot"
  };
  return {
    id:id, type:type, visible:true, navLabel:titles[type] || type,
    settings:{ width:"boxed", padding:"normal", align:"left", background:"default", blockLayout:"grid", blockSurface:"card", theme:{ inherit:true, primary:"", accent:"", card:"", bg:"" } },
    content:{ title:titles[type] || type, text:"", ctaLabel:"", ctaHref:"#contact" },
    blocks:(type === "text" ? [newPageBlock("text")] : (type === "cta" ? [newPageBlock("cta")] : []))
  };
}
function normalizeBuilderSection(sec) {
  sec = sec || newBuilderSection("text");
  if (!sec.id) sec.id = (sec.type || "section") + "-" + Date.now().toString(36);
  if (!sec.type) sec.type = "text";
  if (sec.visible !== false) sec.visible = true;
  if (!sec.navLabel) sec.navLabel = sec.content && sec.content.title ? sec.content.title : sec.type;
  if (!sec.settings) sec.settings = {};
  if (!sec.content) sec.content = {};
  if (!Array.isArray(sec.blocks)) {
    sec.blocks = [];
    if (["text","cta"].indexOf(sec.type) >= 0 && (sec.content.text || sec.content.ctaLabel)) {
      sec.blocks.push(normalizePageBlock({ type:sec.type === "cta" ? "cta" : "text", title:sec.content.title, body:sec.content.text, label:sec.content.ctaLabel, href:sec.content.ctaHref }));
    }
  }
  sec.blocks = sec.blocks.map(normalizePageBlock);
  sec.settings.width = sec.settings.width || "boxed";
  sec.settings.padding = sec.settings.padding || "normal";
  sec.settings.align = sec.settings.align || "left";
  sec.settings.background = sec.settings.background || "default";
  sec.settings.blockLayout = sec.settings.blockLayout || "grid";
  sec.settings.blockSurface = sec.settings.blockSurface || "card";
  if (!sec.settings.theme) sec.settings.theme = { inherit:true, primary:"", accent:"", card:"", bg:"" };
  if (sec.settings.theme.inherit !== false) sec.settings.theme.inherit = true;
  sec.settings.theme.primary = sec.settings.theme.primary || "";
  sec.settings.theme.accent = sec.settings.theme.accent || "";
  sec.settings.theme.card = sec.settings.theme.card || "";
  sec.settings.theme.bg = sec.settings.theme.bg || "";
  sec.content.title = sec.content.title || sec.navLabel || sec.type;
  return sec;
}

// ---- Undo / Redo -----------------------------------------------
const MAX_HISTORY = 60;
let history = [JSON.stringify(data)];
let historyIdx = 0;

function snapshot() {
  const s = JSON.stringify(data);
  if (s === history[historyIdx]) return;
  history = history.slice(0, historyIdx + 1);
  history.push(s);
  if (history.length > MAX_HISTORY) history.shift();
  historyIdx = history.length - 1;
  updateUndoRedo();
}
function undo() {
  if (historyIdx <= 0) return;
  data = JSON.parse(history[--historyIdx]);
  render(); markDirty(); updateUndoRedo(); scheduleSave();
}
function redo() {
  if (historyIdx >= history.length - 1) return;
  data = JSON.parse(history[++historyIdx]);
  render(); markDirty(); updateUndoRedo(); scheduleSave();
}
function updateUndoRedo() {
  document.getElementById("btn-undo").disabled = historyIdx <= 0;
  document.getElementById("btn-redo").disabled = historyIdx >= history.length - 1;
}

// ================================================================
//  HELPERS
// ================================================================
function esc(s) { if (s == null) return ""; const d = document.createElement("div"); d.textContent = String(s); return d.innerHTML; }
function sel(value, expected) { return value === expected ? " selected" : ""; }

function toast(msg, type) {
  type = type || "success";
  const t = document.getElementById("toast");
  t.className = "toast show " + type;
  const icon = type === "success"
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>';
  t.innerHTML = icon + msg;
  clearTimeout(toast._t);
  toast._t = setTimeout(function() { t.classList.remove("show"); }, 2400);
}

function markDirty() {
  dirty = true;
  document.getElementById("save-dot").className = "save-dot dirty";
  document.getElementById("save-text").textContent = "Unsaved";
}
function markClean() {
  dirty = false;
  document.getElementById("save-dot").className = "save-dot";
  document.getElementById("save-text").textContent = "Saved";
}

function onChange() {
  markDirty();
  snapshot();
  scheduleSave();
  schedulePreviewRefresh();
}

// ---- Auto-save to localStorage ----------------------------------
var saveTimer = null;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function() {
    localStorage.setItem("portfolio-draft", JSON.stringify(data));
  }, 300);
}

// ---- Preview refresh (debounced) --------------------------------
var previewTimer = null;
function schedulePreviewRefresh() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(refreshPreview, 800);
}


// ================================================================
//  TAB SWITCHING & RENDER
// ================================================================
function switchTab(tab) {
  currentTab = tab;
  if (tab !== "builder") activeBuilderSectionIndex = null;
  if (tab !== "pages") activeCustomPageIndex = null;
  render();
}

function render() {
  var m = document.getElementById("main");
  var r = { hero: renderHero, builder: renderBuilder, projects: renderProjects, skills: renderSkills, about: renderAbout, contact: renderContact, pages: renderPages, extras: renderExtras, meta: renderMeta };
  m.innerHTML = (r[currentTab] || renderHero)();
  renderSidebar();
  populatePreviewStyleSelectors();
  bindDragDrop();
  restoreOpenCards();
  if (currentTab === "builder" && activeBuilderSectionIndex != null) {
    var card = m.querySelector('[data-builder-section-index="' + activeBuilderSectionIndex + '"]');
    if (card) {
      var body = card.querySelector(".e-card-body");
      var chev = card.querySelector(".chevron");
      if (body) body.classList.add("open");
      if (chev) chev.classList.add("open");
      setTimeout(function() { card.scrollIntoView({ block:"start", behavior:"smooth" }); }, 0);
    }
  }
  if (currentTab === "pages" && activeCustomPageIndex != null) {
    var pageCard = m.querySelector('[data-custom-page-index="' + activeCustomPageIndex + '"]');
    if (pageCard) {

var dragSrcIdx = null, dragListKey = null;

function bindDragDrop() {
  document.querySelectorAll("[data-draggable]").forEach(function(card) {
    card.setAttribute("draggable", "true");
    card.addEventListener("dragstart", function(e) {
      dragSrcIdx = +card.dataset.idx;
      dragListKey = card.dataset.list;
      card.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
    });
    card.addEventListener("dragend", function() { card.classList.remove("dragging"); });
    card.addEventListener("dragover", function(e) { e.preventDefault(); e.dataTransfer.dropEffect = "move"; card.classList.add("drag-over"); });
    card.addEventListener("dragleave", function() { card.classList.remove("drag-over"); });
    card.addEventListener("drop", function(e) {
      e.preventDefault();
      card.classList.remove("drag-over");
      var ti = +card.dataset.idx;
      if (dragListKey === card.dataset.list && dragSrcIdx !== ti) {
        var arr = resolveKey(dragListKey);
        arr.splice(ti, 0, arr.splice(dragSrcIdx, 1)[0]);
        onChange();
        render();
      }
    });
  });
}

function resolveKey(key) {
  return key.split(".").reduce(function(o, k) { return o[/^\d+$/.test(k) ? +k : k]; }, data);
}

function createBuilderTemplate(kind) {

      { type:"text", title:"03 - Polish", body:"Tune the feel, presentation, performance, and story around the result." }
    ].map(normalizePageBlock);
    return [s];
  }
  if (kind === "faq") {

    f.navLabel = "FAQ";
    f.content.title = "FAQ";
    f.settings.blockLayout = "stack";
    f.blocks = [
      { type:"text", title:"What kind of work is this portfolio best for?", body:"Gameplay programming, AI systems, tools, and interactive technical projects." },
      { type:"text", title:"Can this section be edited?", body:"Yes. Every question is just a normal text block inside the Builder." },
      { type:"cta", title:"Still have questions?", body:"Use the contact section to reach out directly.", label:"Contact", href:"#contact" }
    ].map(normalizePageBlock);
    return [f];
  }
  if (kind === "spotlight-cta") {
    var c = newBuilderSection("cta");
    c.navLabel = "Spotlight";
    c.content.title = "Project Spotlight";
    c.settings.blockLayout = "split";
    c.settings.background = "accent";
    c.blocks = [
      { type:"text", title:"Why this matters", body:"Use this space to highlight a standout project, system, result, or recruiter-facing achievement." },
      { type:"cta", title:"Explore the work", body:"Point visitors to the strongest proof page or project detail.", label:"View Projects", href:"#projects" }
    ].map(normalizePageBlock);
    return [c];
  }
  var p = newBuilderSection("text");
  p.navLabel = "Proof";
  p.content.title = "Proof Grid";
  p.settings.blockLayout = "grid";
  p.settings.background = "card";
  p.blocks = [
    { type:"stats", title:"Snapshot", items:[{ label:"Projects", value:"10+" }, { label:"Focus", value:"AI" }, { label:"Engine", value:"Unity" }] },
    { type:"bullet", title:"Strengths", items:["Gameplay systems", "AI behavior", "Fast prototyping"] },
    { type:"quote", title:"Positioning", body:"A compact section for achievements, proof points, or testimonials.", label:"Portfolio note" }

function toggleBuilderSectionTheme(i, btn) {
  var t = data.pages[0].sections[i].settings.theme;
  t.inherit = !(t.inherit !== false);
  btn.classList.toggle("on", t.inherit !== false);
  onChange();
}
function addBuilderBlock(si, type) {
  data.pages[0].sections[si].blocks = data.pages[0].sections[si].blocks || [];
  data.pages[0].sections[si].blocks.push(newPageBlock(type));
  onChange();
  render();
}
function removeBuilderBlock(si, bi) {
  data.pages[0].sections[si].blocks.splice(bi, 1);
  onChange();
  render();
}
function duplicateBuilderBlock(si, bi) {
  var copy = JSON.parse(JSON.stringify(data.pages[0].sections[si].blocks[bi]));
  data.pages[0].sections[si].blocks.splice(bi + 1, 0, copy);
  onChange();
  render();
}
function duplicateBuilderSection(i) {
  var copy = JSON.parse(JSON.stringify(data.pages[0].sections[i]));
  copy.id = sanitizeSlug((copy.id || copy.type) + "-copy-" + Date.now().toString(36));
  data.pages[0].sections.splice(i + 1, 0, copy);
  onChange();
  render();
}
function saveBuilderSectionPrefab(i) {
  var sec = normalizeBuilderSection(JSON.parse(JSON.stringify(data.pages[0].sections[i])));
  var name = prompt("Builder prefab name:", (sec.content && sec.content.title ? sec.content.title : sec.navLabel || "Section") + " Prefab");
  if (!name) return;
  data.customization.builderSectionPrefabs.push({
    name:name,
    section:sec
  });
  onChange();
  render();
  toast("Builder prefab saved");
}
function insertBuilderSectionPrefab(pi) {
  var prefab = data.customization.builderSectionPrefabs[pi];
  if (!prefab || !prefab.section) return;
  var section = prepareInsertedBuilderSection(prefab.section);
  data.pages[0].sections.push(section);
  onChange();
  render();
  toast("Builder prefab inserted");
}
function renameBuilderSectionPrefab(pi) {
  var prefab = data.customization.builderSectionPrefabs[pi];
  if (!prefab) return;
  var name = prompt("Prefab name:", prefab.name || "Section Prefab");
  if (!name) return;
  prefab.name = name;
  onChange();
  render();
}
function deleteBuilderSectionPrefab(pi) {
  data.customization.builderSectionPrefabs.splice(pi, 1);
  onChange();
  render();
}
function prepareInsertedBuilderSection(source) {
  var section = normalizeBuilderSection(JSON.parse(JSON.stringify(source)));
  var base = sanitizeSlug(section.id || section.type || "section") || "section";
  section.id = base + "-" + Date.now().toString(36);
  section.visible = true;
  section.blocks = (section.blocks || []).map(normalizePageBlock);
  return section;
}
function moveBuilderSection(i, dir) {
  var target = i + dir;
  if (target < 0 || target >= data.pages[0].sections.length) return;
  data.pages[0].sections.splice(target, 0, data.pages[0].sections.splice(i, 1)[0]);
  onChange();
  render();
}
function formatSectionType(type) {
  return String(type || "").replace(/-/g, " ").replace(/\b\w/g, function(c) { return c.toUpperCase(); });
}

    }).join("") +

    '<div class="field" style="margin-bottom:8px"><label>Title <span class="sym-trigger" onclick="openSymbolPicker()">\u2726</span></label>' +

    '<span style="flex:1"></span>' +

function addProject() {
  data.projects.push({
    id:"new-project-"+Date.now(), title:"New Project", subtitle:"", status:"completed",
    featured:false, tags:[], thumb:null, video:null, description:"",
    detail:{ lede:"", date:"", demoVideo:null, sections:[], links:[] }
  });
  onChange(); render(); toast("Project added");
}
function duplicateProject(i) {
  var c = JSON.parse(JSON.stringify(data.projects[i]));
  c.id += "-copy"; c.title += " (copy)";
  data.projects.splice(i+1, 0, c);
  onChange(); render(); toast("Duplicated");
}
function ensureDetail(i) {
  if (!data.projects[i].detail) data.projects[i].detail = { lede:"", date:"", demoVideo:null, sections:[], links:[] };
}
function setDemoVideo(i, val) {
  ensureDetail(i);
  data.projects[i].detail.demoVideo = val ? { src:val, poster:data.projects[i].thumb||"" } : null;
}
function addTag(i, tag) {
  tag = tag.trim();
  if (tag && !data.projects[i].tags.includes(tag)) {
    data.projects[i].tags.push(tag);
    onChange();
    // Refocus the tag input inside the same project card after render
    focusAfterRender = '[data-list="projects"][data-idx="' + i + '"] .tag-input';
    render();
  }
}
function addSection(pi, layout) { ensureDetail(pi); data.projects[pi].detail.sections.push({ layout:layout, columns:[{title:"",text:""}] }); render(); }
function addColumn(pi, si) { data.projects[pi].detail.sections[si].columns.push({title:"",text:""}); render(); }
function switchColText(pi, si, ci) { var c = data.projects[pi].detail.sections[si].columns[ci]; delete c.items; c.text = c.text||""; onChange(); render(); }
function switchColList(pi, si, ci) { var c = data.projects[pi].detail.sections[si].columns[ci]; delete c.text; c.items = c.items||[""]; onChange(); render(); }

  var a = document.createElement("a");

  a.download = "style-pack.json";
  a.click();
  URL.revokeObjectURL(a.href);

function importStyleProfiles() {
  var input = document.createElement("input");
  input.type = "file";
  input.accept = ".json";
  input.onchange = function() {
    var file = input.files && input.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function() {
      try {
        var obj = JSON.parse(reader.result);
        var incoming = Array.isArray(obj.profiles) ? obj.profiles : [];
        if (!incoming.length) { toast("No profiles found", "error"); return; }
        incoming.forEach(function(sp) {
          data.customization.styleProfiles.push({
            id: sanitizeSlug(sp.id || sp.name || ("style-" + Date.now())) + "-" + Math.floor(Math.random() * 1000),
            name: sp.name || "Imported Style",
            palette: sp.palette || JSON.parse(JSON.stringify(PALETTE_PRESETS.cyber)),
            fonts: sp.fonts || { display: FONT_STACKS.display, body: FONT_STACKS.system, mono: FONT_STACKS.mono }
          });
        });
        data.customization.currentStyleProfile = data.customization.styleProfiles[data.customization.styleProfiles.length - 1].id;
        syncCustomizationFromProfile(false);
        onChange(); render(); toast("Style pack imported");
      } catch (e) {
        toast("Import failed: " + e.message, "error");
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

  return picked || active;

function updateCompareDiffBadge() {
  var badge = document.getElementById("compare-diff");
  if (!badge) return;
  if (!previewCompare) { badge.style.display = "none"; return; }
  badge.style.display = "";
  var styleAId = (document.getElementById("preview-style-a") || {}).value || "";
  var styleBId = (document.getElementById("preview-style-b") || {}).value || "";
  var styleA = getStyleForPreview(styleAId);
  var styleB = getStyleForPreview(styleBId);
  if (!styleA || !styleB) { badge.innerHTML = ""; return; }
  var paletteKeys = ["bg","card","sec","border","fg","muted","primary","accent"];
  var fontKeys = ["display","body","mono"];
  var changed = [];
  paletteKeys.forEach(function(k) {
    if ((styleA.palette || {})[k] !== (styleB.palette || {})[k]) changed.push(k);
  });
  fontKeys.forEach(function(k) {
    if ((styleA.fonts || {})[k] !== (styleB.fonts || {})[k]) changed.push("font-" + k);
  });
  if (!changed.length) {
    badge.innerHTML = "<strong>No style deltas</strong>";
    return;
  }
  var chips = changed.map(function(token) {
    var active = token === selectedDeltaToken ? " active" : "";
    return '<button class="diff-chip' + active + '" onclick="setCompareDeltaToken(\'' + esc(token) + '\')">' + esc(token) + '</button>';
  }).join("");
  badge.innerHTML = "<strong>" + changed.length + " delta" + (changed.length > 1 ? "s" : "") + ":</strong>" + chips;
}
function setCompareDeltaToken(token) {
  selectedDeltaToken = selectedDeltaToken === token ? "" : token;
  refreshPreview();
}

var symCat = Object.keys(SYMBOLS)[0];
var lastFocusedInput = null;

document.addEventListener("focusin", function(e) {
  if (e.target.matches("input,textarea")) lastFocusedInput = e.target;
});

function openSymbolPicker() {
  document.getElementById("sym-modal").classList.add("open");
  renderSymbols();
}
function closeSymbolPicker() {
  document.getElementById("sym-modal").classList.remove("open");
}
function renderSymbols() {
  document.getElementById("sym-tabs").innerHTML = Object.keys(SYMBOLS).map(function(c) {
    return '<button class="sym-tab' + (c === symCat ? " active" : "") + '" onclick="symCat=\'' + c + '\';renderSymbols()">' + c + '</button>';
  }).join("");
  document.getElementById("sym-grid").innerHTML = SYMBOLS[symCat].map(function(s) {
    return '<button class="sym-btn" onclick="insertSymbol(\'' + s + '\')" title="' + s + '">' + s + '</button>';
  }).join("");
}
function insertSymbol(sym) {
  if (!lastFocusedInput) { toast("Click a text field first", "error"); return; }
  var el = lastFocusedInput;
  var s = el.selectionStart, e = el.selectionEnd;
  el.value = el.value.slice(0, s) + sym + el.value.slice(e);
  el.selectionStart = el.selectionEnd = s + sym.length;
  el.focus();
  el.dispatchEvent(new Event("input", { bubbles: true }));
  closeSymbolPicker();
}


// ================================================================
//  LIVE PREVIEW
// ================================================================
function refreshPreview() {
  if (!previewVisible) return;
  var frame = document.getElementById("preview-frame");
  var frameB = document.getElementById("preview-frame-b");
  var pageSel = document.getElementById("preview-page");
  var projSel = document.getElementById("preview-project");
  var styleA = document.getElementById("preview-style-a");
  var styleB = document.getElementById("preview-style-b");
  var url = pageSel.value;

  if (url.indexOf("project.html") >= 0) {
    projSel.style.display = "";
    projSel.innerHTML = data.projects.map(function(p) {
      return '<option value="' + esc(p.id) + '">' + esc(p.title) + '</option>';
    }).join("");
    url = "project.html?draft=1&id=" + projSel.value;
  } else {
    projSel.style.display = "none";
  }

  document.getElementById("preview-url").textContent = url;
  localStorage.setItem("portfolio-draft", JSON.stringify(data));

  function withStyle(u, styleId) {
    if (!styleId) return u;
    return u + "&styleProfile=" + encodeURIComponent(styleId);
  }
  function effectiveStyleId(id) {
    if (id) return id;
    var current = getCurrentStyleProfile();
    return current ? current.id : "";
  }
  var baseA = withStyle(url, styleA ? styleA.value : "");
  frame.src = baseA + "&_t=" + Date.now();
  if (previewCompare && frameB) {
    var baseB = withStyle(url, styleB ? styleB.value : "");
    var aId = effectiveStyleId(styleA ? styleA.value : "");
    if (selectedDeltaToken) {
      baseB += "&compareBase=" + encodeURIComponent(aId) + "&isolateToken=" + encodeURIComponent(selectedDeltaToken);
    }
    frameB.src = baseB + "&_t=" + Date.now();
  }
  updateCompareDiffBadge();
}

function previewProject(id) {
  var pageSel = document.getElementById("preview-page");
  pageSel.value = "project.html?draft=1&id=";
  var projSel = document.getElementById("preview-project");
  projSel.style.display = "";
  projSel.innerHTML = data.projects.map(function(p) {
    return '<option value="' + esc(p.id) + '"' + (p.id === id ? " selected" : "") + '>' + esc(p.title) + '</option>';
  }).join("");
  if (!previewVisible) togglePreview();
  refreshPreview();
}

function togglePreview() {
  previewVisible = !previewVisible;
  document.getElementById("split-preview").classList.toggle("hidden", !previewVisible);
  document.getElementById("split-handle").style.display = previewVisible ? "" : "none";
  document.getElementById("btn-preview-toggle").classList.toggle("active", previewVisible);
  if (previewVisible) refreshPreview();
}


// ================================================================
//  SPLIT PANE RESIZER
// ================================================================
var splitHandle = document.getElementById("split-handle");
splitHandle.addEventListener("mousedown", function(e) {
  e.preventDefault();
  var preview = document.getElementById("split-preview");
  var startX = e.clientX;
  var startW = preview.offsetWidth;
  splitHandle.classList.add("dragging");
  function onMove(ev) { preview.style.width = Math.max(320, startW + (startX - ev.clientX)) + "px"; }
  function onUp() { splitHandle.classList.remove("dragging"); document.removeEventListener("mousemove", onMove); document.removeEventListener("mouseup", onUp); }
  document.addEventListener("mousemove", onMove);
  document.addEventListener("mouseup", onUp);
});


// ================================================================
//  FILE SAVE / IMPORT
// ================================================================
function generateJS() {
  var js = "// ================================================================\n";
  js += "//\n";
  js += "//  content.js \u2014 Single source of truth for the entire portfolio.\n";
  js += "//\n";
  js += "//  To update the site, edit the data below. No HTML changes needed.\n";
  js += "//  Adding a new project = add one object to SITE.projects. That's it.\n";
  js += "//\n";
  js += "// ================================================================\n\n";
  js += "const SITE = " + JSON.stringify(data, null, 2) + ";\n\n";
  js += "// Live-preview support \u2014 when opened via editor.html the iframe adds ?draft=1\n";
  js += "// so the page reads the editor's in-progress data from localStorage.\n";
  js += "// On the published site this never triggers (no query param, no localStorage).\n";
  js += "try {\n";
  js += '  if (new URLSearchParams(window.location.search).has("draft")) {\n';
  js += '    const _d = localStorage.getItem("portfolio-draft");\n';
  js += '    if (_d) { const _p = JSON.parse(_d); for (const _k in _p) SITE[_k] = _p[_k]; }\n';
  js += "  }\n";
  js += "} catch (_e) { /* silently ignore */ }\n";
  return js;
}

async function saveFile() {
  if ("showSaveFilePicker" in window) {
    try {
      if (!fileHandle) {
        fileHandle = await window.showSaveFilePicker({
          suggestedName: "content.js",
          types: [{ description: "JavaScript", accept: { "application/javascript": [".js"] } }],
        });
      }
      var writable = await fileHandle.createWritable();
      await writable.write(generateJS());
      await writable.close();
      markClean();
      toast("Saved to file!");
      return;
    } catch (e) {
      if (e.name === "AbortError") return;
      fileHandle = null;
    }
  }
  var blob = new Blob([generateJS()], { type: "application/javascript" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "content.js";
  a.click();
  URL.revokeObjectURL(a.href);
  markClean();
  toast("Downloaded \u2014 replace content.js in your project");
}

function importFile() {
  var input = document.getElementById("file-input");
  input.onchange = function() {
    var file = input.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function() {
      try {
        var text = reader.result;
        var fn = new Function(text + "; return SITE;");
        data = JSON.parse(JSON.stringify(fn()));
        normalizeDataModel();
        history = [JSON.stringify(data)];
        historyIdx = 0;
        updateUndoRedo();
        onChange();
        render();
        toast("Imported!");
      } catch (e) {
        toast("Import failed: " + e.message, "error");
      }
    };
    reader.readAsText(file);
    input.value = "";
  };
  input.click();
}


// ================================================================
//  KEYBOARD SHORTCUTS
// ================================================================
document.addEventListener("keydown", function(e) {
  var mod = e.ctrlKey || e.metaKey;
  if (mod && e.key === "s") { e.preventDefault(); saveFile(); }
  if (mod && e.key === "z" && !e.shiftKey) { e.preventDefault(); undo(); }
  if (mod && (e.key === "y" || (e.key === "z" && e.shiftKey))) { e.preventDefault(); redo(); }
  if (e.key === "Escape") closeSymbolPicker();
});

// ================================================================
var savedDraft = localStorage.getItem("portfolio-draft");
if (savedDraft) {
  try {
    data = JSON.parse(savedDraft);
    normalizeDataModel();
    history = [JSON.stringify(data)];
  } catch(e) {}
}
normalizeDataModel();

render();
refreshPreview();

projSel2.innerHTML = data.projects.map(function(p) {
